name: Workflow Check
on: [push, pull_request]
jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest] # Checks that the build actually compiles on both mac and windows.
    runs-on: ${{ matrix.os }}
    steps: # Downloads the code and the installs Java for compilation.
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: # Describes what build and version of Java.
          distribution: temurin
          java-version: '21'
      - name: Compile
        shell: bash
        run: javac -d out $(find src -name "*.java")
